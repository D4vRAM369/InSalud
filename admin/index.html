<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InSalud — Panel de Administración</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: #1a1a2e; }
    .admin-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    /* Login */
    .login-box {
      background: #16213e;
      padding: 40px;
      border-radius: 12px;
      max-width: 400px;
      margin: 80px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-box h1 { color: #e94560; font-size: 1.5rem; margin-bottom: 24px; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: white;
      font-size: 1rem;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .login-box button:hover { background: #c73650; }
    .login-error { color: #e74c3c; text-align: center; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }
    .dashboard-header h1 { color: #e94560; font-size: 1.4rem; }
    .btn-logout {
      background: transparent;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 140px;
      background: #16213e;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card .num { font-size: 2rem; font-weight: 800; color: #e94560; }
    .stat-card .label { font-size: 0.8rem; color: #888; margin-top: 4px; }

    /* Filters */
    .filters-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filters-bar select, .filters-bar button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #16213e;
      color: white;
      font-size: 0.9rem;
    }
    .filters-bar button { cursor: pointer; border: none; }
    .filters-bar button.active { background: #e94560; color: white; }
    .filters-bar button:not(.active) { background: #16213e; color: #aaa; }

    /* Complaint Cards */
    .complaint-card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 14px;
      border-left: 4px solid #0f3460;
    }
    .complaint-card.pending { border-left-color: #f39c12; }
    .complaint-card.published { border-left-color: #27ae60; }
    .complaint-card.rejected { border-left-color: #e74c3c; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-center { color: white; font-weight: 700; }
    .card-date { color: #888; font-size: 0.8rem; }
    .card-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .badge-pending { background: #f39c12; color: #000; }
    .badge-published { background: #27ae60; color: white; }
    .badge-rejected { background: #e74c3c; color: white; }
    .card-category {
      display: inline-block;
      background: #0f3460;
      color: #4a90d9;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-bottom: 10px;
      margin-left: 6px;
    }
    .card-desc { color: #ccc; line-height: 1.5; margin-bottom: 14px; white-space: pre-wrap; }
    .card-email { color: #888; font-size: 0.8rem; margin-bottom: 10px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-publish { background: #27ae60; color: white; }
    .btn-publish:hover { background: #219a52; }
    .btn-reject { background: #e74c3c; color: white; }
    .btn-reject:hover { background: #c0392b; }
    .btn-unpublish { background: #f39c12; color: #000; }
    .btn-unpublish:hover { background: #e67e22; }
    .btn-delete { background: #555; color: white; }
    .btn-delete:hover { background: #333; }

    .no-data { text-align: center; color: #888; padding: 40px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginView" class="login-box">
    <h1>&#9764; InSalud Admin</h1>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Entrar</button>
    </form>
    <div id="loginError" class="login-error" role="alert"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardView" class="dashboard admin-container">
    <div class="dashboard-header">
      <h1>&#9764; InSalud — Admin</h1>
      <button class="btn-logout" onclick="handleLogout()">Cerrar sesión</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pendientes</div></div>
      <div class="stat-card"><div class="num" id="statPublished">0</div><div class="label">Publicadas</div></div>
      <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">Rechazadas</div></div>
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <button class="active" data-filter="all" onclick="setFilter('all', this)">Todas</button>
      <button data-filter="pending" onclick="setFilter('pending', this)">Pendientes</button>
      <button data-filter="published" onclick="setFilter('published', this)">Publicadas</button>
      <button data-filter="rejected" onclick="setFilter('rejected', this)">Rechazadas</button>
    </div>

    <!-- List -->
    <div id="adminError" role="alert" style="color:#ffb4b4;"></div>
    <div id="complaintsList"></div>
    <div id="noData" class="no-data" style="display:none;">No hay reclamaciones</div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    // ---- STATE ----
    let allComplaints = [];
    let currentFilter = 'all';

    // ---- DOM ----
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginError = document.getElementById('loginError');
    const complaintsList = document.getElementById('complaintsList');
    const noData = document.getElementById('noData');

    // Registrar primero el formulario: Enter y click recorren la misma validación.
    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      handleLogin();
    });

    function showLoginError(error) {
      loginError.textContent = error.message || 'No se pudo conectar con Supabase.';
      loginError.style.display = 'block';
    }

    async function requireAdmin(user) {
      const { data: profile, error } = await supabaseClient
        .from('profiles').select('role').eq('id', user.id).maybeSingle();
      // Distinguir permisos RLS de contraseña incorrecta facilita diagnosticar.
      if (error) throw new Error(`No se pudo leer el perfil (RLS): ${error.message}`);
      if (!profile || profile.role !== 'admin') {
        await supabaseClient.auth.signOut();
        throw new Error('No tienes permisos de administrador.');
      }
    }

    async function restoreSession() {
      try {
        if (!supabaseClient) throw new Error('No se pudo cargar Supabase. Comprueba la conexión y recarga.');
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        // Una sesión existente también necesita comprobar su rol.
        if (session) {
          await requireAdmin(session.user);
          await showDashboard();
        }
      } catch (error) { showLoginError(error); }
    }

    async function handleLogin() {
      const button = document.getElementById('loginBtn');
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Entrando…';
      loginError.style.display = 'none';
      try {
        if (!supabaseClient) throw new Error('No se pudo cargar Supabase. Comprueba la conexión y recarga.');
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await requireAdmin(data.user);
        await showDashboard();
      } catch (error) { showLoginError(error); }
      finally {
        button.disabled = false;
        button.textContent = 'Entrar';
      }
    }

    async function handleLogout() {
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        allComplaints = [];
        complaintsList.innerHTML = '';
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
        document.getElementById('loginPassword').value = '';
      } catch (error) { alert('No se pudo cerrar sesión: ' + error.message); }
    }

    // ---- DASHBOARD ----
    async function showDashboard() {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      try { await loadComplaints(); }
      catch (error) { document.getElementById('adminError').textContent = error.message; }
    }

    async function loadComplaints() {
      document.getElementById('adminError').textContent = '';
      // PostgREST limita filas por respuesta; paginar evita estadísticas incompletas.
      const rows = [];
      for (let offset = 0; ; offset += 500) {
        const { data, error } = await supabaseClient.from('complaints')
          .select('*').order('created_at', { ascending: false }).order('id')
          .range(offset, offset + 499);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 500) break;
      }
      allComplaints = rows;
      updateStats();
      renderComplaints();
    }

    function updateStats() {
      document.getElementById('statPending').textContent = allComplaints.filter(c => c.status === 'pending').length;
      document.getElementById('statPublished').textContent = allComplaints.filter(c => c.status === 'published').length;
      document.getElementById('statRejected').textContent = allComplaints.filter(c => c.status === 'rejected').length;
      document.getElementById('statTotal').textContent = allComplaints.length;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filters-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderComplaints();
    }

    function renderComplaints() {
      const filtered = currentFilter === 'all'
        ? allComplaints
        : allComplaints.filter(c => c.status === currentFilter);

      if (filtered.length === 0) {
        complaintsList.innerHTML = '';
        noData.style.display = 'block';
        return;
      }
      noData.style.display = 'none';

      complaintsList.innerHTML = filtered.map(c => `
        <div class="complaint-card ${esc(c.status)}">
          <div class="card-top">
            <span class="card-center">${esc(c.center)}</span>
            <span class="card-date">${fmtDate(c.incident_date)} · ${fmtDate(c.created_at)}</span>
          </div>
          <span class="card-badge badge-${esc(c.status)}">${esc(c.status)}</span>
          <span class="card-category">${esc(c.category)}</span>
          ${c.email ? `<div class="card-email">&#9993; ${esc(c.email)}</div>` : ''}
          <div class="card-desc">${esc(c.description)}</div>
          <div class="card-actions">
            <button class="btn-action" data-action="attachments" data-id="${esc(c.id)}">Ver adjuntos</button>
            ${c.status !== 'published' ? `<button class="btn-action btn-publish" data-action="published" data-id="${esc(c.id)}">Publicar</button>` : ''}
            ${c.status !== 'rejected' ? `<button class="btn-action btn-reject" data-action="rejected" data-id="${esc(c.id)}">Rechazar</button>` : ''}
            ${c.status === 'published' ? `<button class="btn-action btn-unpublish" data-action="pending" data-id="${esc(c.id)}">Despublicar</button>` : ''}
            <button class="btn-action btn-delete" data-action="delete" data-id="${esc(c.id)}">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    // Los datos no entran en código onclick: evita mezclar texto y JavaScript.
    complaintsList.addEventListener('click', async event => {
      const button = event.target.closest('button[data-id]');
      if (!button || button.disabled) return;
      button.disabled = true;
      document.getElementById('adminError').textContent = '';
      try {
        const { id, action } = button.dataset;
        if (action === 'delete') await deleteComplaint(id);
        else if (action === 'attachments') await showAttachments(id, button);
        else await updateStatus(id, action);
      } catch (error) {
        document.getElementById('adminError').textContent = error.message;
      } finally { button.disabled = false; }
    });

    async function updateStatus(id, status) {
      if (!['published', 'pending', 'rejected'].includes(status)) throw new Error('Estado no válido.');
      // SELECT permite detectar permisos denegados que actualizan cero filas sin error.
      const { data, error } = await supabaseClient.from('complaints')
        .update({ status }).eq('id', id).select('id');
      if (error) throw error;
      if (!data.length) throw new Error('No se actualizó la reclamación. Revisa permisos o recarga.');
      await loadComplaints();
    }

    function attachmentPath(value) {
      // Compatibilidad con URLs antiguas: solo aceptar objetos de nuestro bucket.
      const prefix = SUPABASE_URL + '/storage/v1/object/public/complaint-attachments/';
      const path = value.startsWith(prefix) ? decodeURIComponent(value.slice(prefix.length)) : value;
      if (!path.startsWith('complaints/') || path.includes('..') || path.includes('://')) {
        throw new Error('Ruta de adjunto no válida.');
      }
      return path;
    }

    async function showAttachments(id, button) {
      const { data, error } = await supabaseClient.from('attachments')
        .select('file_url').eq('complaint_id', id);
      if (error) throw error;
      const list = document.createElement('div');
      for (const [index, attachment] of data.entries()) {
        const { data: signed, error: signError } = await supabaseClient.storage
          .from('complaint-attachments').createSignedUrl(attachmentPath(attachment.file_url), 60);
        if (signError) throw signError;
        const link = document.createElement('a');
        link.href = signed.signedUrl;
        link.textContent = `Adjunto ${index + 1} (enlace válido 60 s) `;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        list.appendChild(link);
      }
      if (!data.length) list.textContent = 'Sin adjuntos.';
      const old = button.parentElement.querySelector('.attachment-links');
      if (old) old.remove();
      list.className = 'attachment-links';
      button.parentElement.appendChild(list);
    }

    async function deleteComplaint(id) {
      if (!confirm('¿Eliminar esta reclamación y sus adjuntos permanentemente?')) return;
      const { data: attachments, error: readError } = await supabaseClient
        .from('attachments').select('file_url').eq('complaint_id', id);
      if (readError) throw readError;
      const paths = attachments.map(a => attachmentPath(a.file_url));
      const { data, error } = await supabaseClient.from('complaints').delete().eq('id', id).select('id');
      if (error) throw error;
      if (!data.length) throw new Error('No se eliminó la reclamación. Revisa permisos o recarga.');
      // FK elimina metadatos; Storage requiere otra operación y puede fallar por separado.
      if (paths.length) {
        const { error: storageError } = await supabaseClient.storage.from('complaint-attachments').remove(paths);
        if (storageError) {
          await loadComplaints();
          throw new Error('Reclamación eliminada; quedan archivos privados por limpiar en Storage.');
        }
      }
      await loadComplaints();
    }

    // Escapar también comillas: algunos valores aparecen dentro de atributos HTML.
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }
    function fmtDate(s) { return new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T12:00:00' : s).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }); }

    restoreSession();
  </script>
</body>
</html>
