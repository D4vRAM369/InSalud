name: Recordatorio 60 días (Decreto 8/2025)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trigger-deadline-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Edge Function deadline-reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET no está configurado en GitHub Secrets."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            "https://ehdgjsjmbyfxedazxtky.supabase.co/functions/v1/deadline-reminder" \
            -H "x-cron-secret: ${CRON_SECRET}"
